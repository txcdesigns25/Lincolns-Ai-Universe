# Local development database. `docker compose up -d` then `pnpm db:migrate`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: universe
      POSTGRES_PASSWORD: universe
      POSTGRES_DB: universe
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
